name: CI

on:
  push:
    branches: [main, 'bootstrap/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/aaa-board-atmosphere.test.js
      - run: node --check src/aaa-board-atmosphere.js
      - run: node --test tests/aaa-vibrance.test.js
      - run: node --check scripts/visual-vibrance-qa.mjs
      - run: node --test tests/aaa-world-life.test.js
      - run: node --check src/aaa-world-life.js
      - run: node --check scripts/world-life-qa.mjs
