name: Browser QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit for QA
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps webkit
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/poply-http.log 2>&1 &
          echo $! > /tmp/poply-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poply-http.log
          exit 1
      - name: Run mobile WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/browser-qa.mjs
      - name: Run installed-app safe-area WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/standalone-safe-area-qa.mjs
      - name: Run family-color and living-Place WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/visual-vibrance-qa.mjs
      - name: Run authored Place-life WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/world-life-qa.mjs
      - name: Run player progression WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/progression-qa.mjs
      - name: Run restoration payoff WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/restoration-payoff-qa.mjs
      - name: Run visible purpose-loop WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/purpose-qa.mjs
      - name: Run first-session rebuild WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/first-session-qa.mjs
      - name: Run guest loyalty WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/guest-loyalty-qa.mjs
      - name: Run actionable milestone-focus WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/milestone-focus-qa.mjs
      - name: Run Energy reserve WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/energy-reserve-qa.mjs
      - name: Run Collection Book WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/collection-qa.mjs
      - name: Run Storage WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/storage-qa.mjs
      - name: Run Daily Goals WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/daily-qa.mjs
      - name: Run Place Map WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/place-map-qa.mjs
      - name: Run Place 03 WebKit QA
        env: {QA_BASE_URL: http://127.0.0.1:4173, QA_OUT_DIR: qa-artifacts}
        run: node scripts/place03-qa.mjs
      - name: Upload mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-qa
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 7
