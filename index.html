<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0d1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Poply — connect matching pieces, pop satisfying chains, keep the flow.">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Poply</title>
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/objectives.css">
  <link rel="stylesheet" href="./src/game-shell.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="game-header">
      <div class="brand-row">
        <div class="brand-lockup">
          <h1>Poply</h1>
          <span id="level-pill" class="level-pill">Level 1</span>
        </div>
        <button id="restart" class="restart-button" type="button" aria-label="Restart" title="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.34 5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="tagline">Connect. Pop. Flow.</p>
      <nav id="level-trail" class="level-trail" aria-label="Level progress"></nav>
    </header>

    <section class="game-layout" aria-label="Poply game">
      <aside class="mission-panel" aria-label="Level objective">
        <div class="mission-head">
          <div class="score-block">
            <span id="score-label" class="eyebrow">Score</span>
            <div class="score-value"><strong id="score">0</strong><span>/ <span id="target">4,000</span></span></div>
          </div>

          <div class="mission-stats">
            <div class="mission-stat">
              <span id="moves-label">Moves</span>
              <strong id="moves">16</strong>
            </div>
            <div class="mission-stat best-stat">
              <span id="best-label">Best chain</span>
              <strong id="best-chain">—</strong>
            </div>
          </div>
        </div>

        <div class="progress-track" aria-label="Level progress">
          <div id="progress" class="progress-fill"></div>
          <div class="progress-shine" aria-hidden="true"></div>
        </div>

        <div class="objective-block">
          <span id="goals-label" class="eyebrow">Goals</span>
          <div id="objectives" class="objective-list" aria-live="polite"></div>
        </div>

        <p id="power-tip" class="power-tip">5 matching = Blast · 7+ matching = Prism</p>
      </aside>

      <div class="board-zone">
        <div id="board-frame" class="board-frame">
          <div class="board-halo" aria-hidden="true"></div>
          <div id="board" class="board" role="grid" aria-label="Connect matching pieces"></div>
          <svg id="chain-svg" class="chain-svg" aria-hidden="true" preserveAspectRatio="none">
            <polyline id="hint-polyline" class="hint-polyline" points=""></polyline>
            <polyline id="chain-polyline" class="chain-polyline" points=""></polyline>
          </svg>
          <div id="fx" class="fx-layer" aria-hidden="true"></div>
          <div id="combo" class="combo-badge" aria-hidden="true"></div>
        </div>

        <div class="play-footer">
          <p id="status" class="status" data-tone="neutral" aria-live="polite">Drag through 3+ matching pieces.</p>
        </div>
      </div>
    </section>

    <section id="result" class="result-sheet" aria-live="polite" hidden>
      <div class="result-card">
        <div id="stars" class="stars" aria-label="Level stars">☆ ☆ ☆</div>
        <h2 id="result-title">Level clear</h2>
        <p id="result-copy">Great chain.</p>
        <strong id="result-score" class="result-score">0</strong>
        <p id="result-progress" class="result-progress"></p>
        <button id="result-action" class="primary-button" type="button">Next level</button>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
