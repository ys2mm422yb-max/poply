<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#102a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Poply Places — merge items, serve orders and build your own places.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/v2.css">
  <title>Poply Places</title>
</head>
<body>
  <main class="poply-app" aria-label="Poply Places">
    <section id="place-hero" class="place-hero" data-stage="0" aria-label="Poply Place">
      <div class="hero-top">
        <div class="brand" aria-label="Poply Places">
          <div class="brand-logo">Poply<span>PLACES</span></div>
        </div>
        <div class="hero-actions">
          <div class="resources" aria-label="Ressourcen">
            <div class="resource energy"><i>⚡</i><span id="energy-value">40/40</span><b>+</b></div>
            <div class="resource coins"><i>●</i><span id="coins-value">100</span><b>+</b></div>
            <div class="resource stars"><i>★</i><span id="stars-value">0</span></div>
          </div>
          <details class="game-menu">
            <summary aria-label="Menü">☰</summary>
            <div class="menu-panel">
              <strong>Poply Places</strong>
              <button id="reset-button" type="button">Spielstand zurücksetzen</button>
            </div>
          </details>
        </div>
      </div>

      <div class="hero-bottom">
        <div class="place-card">
          <div class="place-card-title"><span class="place-badge">1</span><strong id="place-name">Café am Meer</strong></div>
          <small id="place-progress">Ausbau 0/3</small>
          <div class="place-progress" aria-hidden="true"><span id="place-progress-fill"></span></div>
        </div>
        <div class="upgrade-cta">
          <div class="upgrade-icon" aria-hidden="true">💡</div>
          <div class="upgrade-copy"><span id="upgrade-name">Lichter</span><small id="upgrade-cost">★ 4</small></div>
          <button id="build-button" type="button">Bauen</button>
        </div>
      </div>
    </section>

    <section id="orders-section" class="section orders-section" aria-labelledby="orders-heading">
      <div class="section-head">
        <div><h2 id="orders-heading">Aufträge</h2><span>Kunden bedienen & Sterne verdienen</span></div>
        <b>3 aktiv</b>
      </div>
      <div id="orders" class="orders" aria-live="polite"></div>
    </section>

    <section id="board-section" class="board-wrap" aria-labelledby="board-heading">
      <div class="section-head board-head">
        <div><h2 id="board-heading">Merge-Board</h2><span>2 gleiche Items = nächste Stufe</span></div>
        <div class="board-capacity"><strong id="board-used">8</strong><span>/49</span></div>
      </div>
      <div class="board-shell">
        <div id="merge-board" class="merge-board" role="grid" aria-label="Merge Board"></div>
        <div class="board-meta">
          <p id="hint" class="hint">Generator antippen. Gleiche Items zusammenziehen.</p>
          <div id="item-info" class="item-info" aria-live="polite">
            <span class="info-dot" aria-hidden="true">i</span>
            <span><strong>Poply V2</strong><small>Item antippen für Details</small></span>
          </div>
        </div>
      </div>
    </section>

    <nav class="bottom-bar" aria-label="Spielbereiche">
      <button class="nav-button" type="button" data-scroll="place-hero"><strong>⌂</strong><span>Place</span></button>
      <button class="nav-button" type="button" data-scroll="orders-section"><strong>☑</strong><span>Aufträge</span></button>
      <button class="nav-button active" type="button" data-scroll="board-section"><strong>▦</strong><span>Board</span></button>
      <button class="nav-button" type="button" data-action="collection"><strong>★</strong><span>Sammlung</span></button>
      <button class="nav-button" type="button" data-action="shop"><strong>▣</strong><span>Shop</span></button>
    </nav>
  </main>
  <div id="drag-ghost" class="drag-ghost" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/v2-main.js"></script>
</body>
</html>
