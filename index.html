<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#58c2ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Poply Places — merge items, serve orders and build your own places.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/v2.css">
  <title>Poply Places</title>
</head>
<body>
  <main class="poply-app" aria-label="Poply Places">
    <section id="place-hero" class="place-hero" data-stage="0" aria-label="Poply Place">
      <div class="hero-top">
        <div class="brand" aria-label="Poply Places">
          <div class="brand-logo">Poply<span>PLACES</span></div>
        </div>
        <div class="resources" aria-label="Ressourcen">
          <div class="resource"><i>⚡</i><span id="energy-value">40/40</span></div>
          <div class="resource"><i>●</i><span id="coins-value">100</span></div>
          <div class="resource"><i>★</i><span id="stars-value">0</span></div>
        </div>
      </div>
      <div class="hero-bottom">
        <div class="place-card">
          <strong id="place-name">Café am Meer</strong>
          <small id="place-progress">Ausbau 0/3</small>
          <div class="place-progress" aria-hidden="true"><span id="place-progress-fill"></span></div>
        </div>
        <div class="upgrade-cta">
          <div class="upgrade-copy"><span id="upgrade-name">Lichter</span><small id="upgrade-cost">★ 4</small></div>
          <button id="build-button" type="button">Bauen</button>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="orders-heading">
      <div class="section-head"><h2 id="orders-heading">Aufträge</h2><span>Merge → liefern → ausbauen</span></div>
      <div id="orders" class="orders" aria-live="polite"></div>
    </section>

    <section class="board-wrap" aria-labelledby="board-heading">
      <div class="section-head"><h2 id="board-heading">Merge-Board</h2><span>2 gleiche = nächste Stufe</span></div>
      <div class="board-shell">
        <div id="merge-board" class="merge-board" role="grid" aria-label="Merge Board"></div>
        <div class="board-meta">
          <p id="hint" class="hint">Tippe Generatoren an und ziehe gleiche Items zusammen.</p>
          <div id="item-info" class="item-info" aria-live="polite"><span><strong>Poply V2</strong><small>Antippen zum Erkunden</small></span></div>
        </div>
      </div>
    </section>

    <nav class="bottom-bar" aria-label="Spielbereiche">
      <button class="nav-button" type="button"><strong>☑</strong>Aufträge</button>
      <button class="nav-button active" type="button"><strong>▦</strong>Board</button>
      <button class="nav-button" type="button"><strong>⌂</strong>Place</button>
      <button id="reset-button" class="nav-button utility" type="button"><strong>↻</strong>Reset</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/v2-main.js"></script>
</body>
</html>
